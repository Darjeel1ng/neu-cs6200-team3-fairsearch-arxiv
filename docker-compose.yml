services:
  dashboard:
    build:
      context: .
      args:
        INSTALL_LIVE_RETRIEVAL: "false"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      # The image bakes the app in via `COPY dashboard` at build time, so
      # without this every UI edit needs a full rebuild to show up. Mounting
      # the source over it lets Streamlit's file watcher hot-reload on save.
      # Dependency or Dockerfile changes still require `--build`.
      - ./dashboard:/app/dashboard:ro
    environment:
      DASHBOARD_DATA_ROOT: /app/data

  # Opt-in profile that bundles the live-retrieval deps. Run with:
  #   docker compose --profile live up dashboard-live
  dashboard-live:
    profiles: ["live"]
    build:
      context: .
      args:
        INSTALL_LIVE_RETRIEVAL: "true"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./dashboard:/app/dashboard:ro
    environment:
      DASHBOARD_DATA_ROOT: /app/data
